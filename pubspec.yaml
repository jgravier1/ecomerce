name: ecomerce
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  dio: ^5.8.0+1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  get_it: ^8.0.3
  google_sign_in: ^6.3.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_svg: ^2.2.0
  go_router: ^16.0.0
  intl: 0.20.2
  provider: ^6.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true # Add this line

  assets:
    - .env
    - assets/images/
    - assets/svg/

flutter_native_splash:
  background_image: assets/images/splash.png
  android: true
  ios: true
  fullscreen: true
